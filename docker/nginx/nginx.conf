# nginx for the LanCompass static site. Runs as the unprivileged nginx user on
# port 8080 and writes only to /tmp, so the container can run read-only.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/manifest+json webmanifest;
  }

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format main '$remote_addr "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" $request_time';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  charset utf-8;
  charset_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain text/xml application/xml;

  # HTTPS-only headers: on when the request came over TLS, directly or through a proxy.
  map $http_x_forwarded_proto $lc_forwarded_https {
    default 0;
    https 1;
  }
  map "$scheme:$lc_forwarded_https" $lc_https {
    default 0;
    "https:0" 1;
    "~:1$" 1;
  }
  map $lc_https $lc_hsts {
    1 "max-age=63072000; includeSubDomains";
    default "";
  }
  map $lc_https $lc_upgrade {
    1 "; upgrade-insecure-requests";
    default "";
  }

  include /etc/nginx/conf.d/site.conf;
}
