server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  absolute_redirect off;
  port_in_redirect off;

  include /etc/nginx/snippets/security-headers.conf;

  # Liveness probe for Docker and orchestrators; not part of the site.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Content-hashed build assets never change.
  location ^~ /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.(?:png|svg|webmanifest|txt|xml|woff2|mp4|webm|vtt|jpg|webp)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # The Netlify/Cloudflare headers file is applied above; do not serve it.
  location = /_headers {
    return 404;
  }

  # Pages: /product redirects to /product/ (Astro trailingSlash "always"), then index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    if (-d $request_filename) {
      rewrite [^/]$ $uri/ permanent;
    }
    try_files $uri $uri/index.html =404;
  }

  # Each locale gets its own 404 page.
  location /he/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    error_page 404 /he/404.html;
    if (-d $request_filename) {
      rewrite [^/]$ $uri/ permanent;
    }
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    include /etc/nginx/snippets/security-headers.conf;
    internal;
  }
  location = /he/404.html {
    include /etc/nginx/snippets/security-headers.conf;
    internal;
  }
}
