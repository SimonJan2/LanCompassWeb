<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Minimal fontconfig for the build stage (the slim image ships none). OG images
     register their own Inter and Heebo files; this only gives fontconfig a valid config. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
</fontconfig>
